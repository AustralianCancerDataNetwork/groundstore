[project]
name = "groundstore"
dynamic = ["version"]
description = "Shared mapping-task contracts for Groundworkers workflows."
requires-python = ">=3.12"
dependencies = [
    "oa-configurator>=1.3.0,<2",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0.45,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "ty>=0.0.59",
]
tui = [
    "groundskeeping>=0.9.0,<0.10",
    "omop-alchemy>=1.1.0,<2",
    "psycopg[binary]>=3.2,<4",
]

postgres = [
    "psycopg[binary]>=3.1,<4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
groundstore-review = "groundstore.tui:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/groundstore"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
